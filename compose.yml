services:
  app:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8770:8770"
    volumes:
      - kids-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  kids-data:
