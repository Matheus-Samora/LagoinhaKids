name: Verify release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lagoinha-kids-ci .
      - name: Start isolated smoke container
        run: >-
          docker run -d --name kids-ci -p 127.0.0.1:8780:8770
          -e KIDS_BOOTSTRAP_EMAIL=ci-admin@example.test
          -e KIDS_BOOTSTRAP_PASSWORD=CI-container-only-password
          lagoinha-kids-ci
      - name: Check HTTP and supervised worker
        run: |
          python - <<'PY'
          import json,time,urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8780/api/health',timeout=3) as response:
                      assert json.load(response)['status']=='ok'
                  break
              except Exception:
                  if attempt==29:raise
                  time.sleep(1)
          PY
          docker exec kids-ci python -c "import os; assert len([n for n in os.listdir('/proc') if n.isdigit()])>=3"
      - if: always()
        run: docker logs kids-ci || true
      - if: always()
        run: docker rm -f kids-ci || true
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kids
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kids_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KIDS_DATABASE_URL: postgresql://kids:ci-only-password@127.0.0.1:5432/kids_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q
      - name: Restore isolated PostgreSQL backup
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" pg_dump -U kids -d kids_test -Fc -f /tmp/isolated.dump
          docker exec "$PG_CONTAINER" createdb -U kids kids_restored
          docker exec "$PG_CONTAINER" pg_restore --exit-on-error -U kids -d kids_restored /tmp/isolated.dump
          python - <<'PY'
          import psycopg
          source=psycopg.connect('postgresql://kids:ci-only-password@127.0.0.1:5432/kids_test')
          restored=psycopg.connect('postgresql://kids:ci-only-password@127.0.0.1:5432/kids_restored')
          tables=[r[0] for r in source.execute("SELECT tablename FROM pg_tables WHERE schemaname='public'")]
          from psycopg import sql
          for table in tables:
              query=sql.SQL('SELECT count(*) FROM {}').format(sql.Identifier(table))
              assert source.execute(query).fetchone()==restored.execute(query).fetchone(),table
          constraints="SELECT count(*) FROM pg_constraint WHERE contype IN ('f','p','u') AND connamespace='public'::regnamespace"
          assert source.execute(constraints).fetchone()==restored.execute(constraints).fetchone()
          print('Isolated restore: tables, row counts and constraints verified.')
          PY
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q
      - run: npm ci
      - run: node --test tests/realtime_client.test.mjs tests/api_response.test.mjs tests/lockfile.test.mjs tests/church_attendance_client.test.mjs tests/cloudflare_paging.test.mjs tests/native_call_alerts.test.mjs tests/app_updates.test.mjs tests/device_compat.test.mjs
      - run: node tests/notification-behavior.mjs
      - run: node tests/material-upload.mjs
      - run: node tests/participants-modal.mjs
      - run: npm run build
      - run: npm audit --omit=dev
